services:

  ###########################
  # DEPENDENCIES            #
  ###########################

  redis:
    image: redis:8.8.0
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.16
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      # Comment-out the line below for a cluster of multiple nodes
      - discovery.type=single-node
      # Uncomment the line below below for a cluster of multiple nodes
      # - cluster.name=docker-cluster
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery="ERROR"
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE} -Xmx${ELASTIC_MEMORY_SIZE}"
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://elasticsearch:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 50
  minio:
    image: minio/minio:latest
    volumes:
      - s3data:/data
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}    
    command: server /data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=rabbit01@localhost
    volumes:
      - type: bind
        source: ./rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf 
      - amqpdata:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  ###########################
  # OPENCTI                 #
  ###########################
  
  opencti:
    image: local/opencti-platform-work-id-guard:7.260910.0
    build:
      context: ./platform/work-id-guard
      args:
        BASE_IMAGE: opencti/platform:7.260910.0
    environment:
      - NODE_OPTIONS=--max-old-space-size=8096
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_EXTERNAL_SCHEME}://${OPENCTI_HOST}:${OPENCTI_PORT}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY}
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SMTP__HOSTNAME=${SMTP_HOSTNAME}
      - SMTP__PORT=25
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY}
    ports:
      - "${OPENCTI_PORT}:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    healthcheck:
      test:  ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    image: opencti/worker:7.260910.0
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3
    restart: always

  ###########################
  # OPENCTI CONNECTORS      #
  ###########################

  connector-export-file-stix:
    image: opencti/connector-export-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-csv:
    image: opencti/connector-export-file-csv:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_CSV_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-txt:
    image: opencti/connector-export-file-txt:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_TXT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileTxt
      - CONNECTOR_SCOPE=text/plain
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-stix:
    image: opencti/connector-import-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-document:
    image: opencti/connector-import-document:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_DOCUMENT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportDocument
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_ONLY_CONTEXTUAL=false # Only extract data related to an entity (a report, a threat actor, etc.)
      - IMPORT_DOCUMENT_CREATE_INDICATOR=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-yara:
    image: opencti/connector-import-file-yara:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_YARA_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileYARA
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=text/yara+plain
      - CONNECTOR_AUTO=false # Enable/disable auto-import of file
      - YARA_IMPORT_FILE_SPLIT_RULES=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-analysis:
    image: opencti/connector-import-document:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ANALYSIS_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_ANALYSIS
      - CONNECTOR_NAME=ImportDocumentAnalysis
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=false # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_ONLY_CONTEXTUAL=false # Only extract data related to an entity (a report, a threat actor, etc.)
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-external-reference:
    image: opencti/connector-import-external-reference:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_EXTERNAL_REFERENCE_ID}
      - CONNECTOR_NAME=ImportExternalReference
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-ioc-trust-cluster:
    build:
      context: ./connectors/ioc-trust-cluster
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IOC_TRUST_CLUSTER_ID}
      - CONNECTOR_NAME=IOC Trust Cluster
      - CONNECTOR_AUTO=true
      - CONNECTOR_CONFIDENCE_LEVEL=75
      - CONNECTOR_LOG_LEVEL=info
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-vectra-metadata-fp:
    build:
      context: ./connectors/vectra-metadata-fp
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_VECTRA_METADATA_FP_ID}
      - CONNECTOR_NAME=Vectra Metadata Commonness
      - CONNECTOR_AUTO=true
      - CONNECTOR_LOG_LEVEL=info
      - CANTINA_TOKEN=${CANTINA_TOKEN:-}
      - CANTINA_USER=${CANTINA_USER:-}
      - CANTINA_DARKSTAR_URL=${CANTINA_DARKSTAR_URL:-https://cantina.vectra.ai/api/darkstar/lambda}
      - VECTRA_METADATA_CUSTOMER=${VECTRA_METADATA_CUSTOMER:-}
      - VECTRA_NDR_URL=${VECTRA_NDR_URL:-}
      - VECTRA_NDR_CLIENT_ID=${VECTRA_NDR_CLIENT_ID:-}
      - VECTRA_NDR_CLIENT_SECRET=${VECTRA_NDR_CLIENT_SECRET:-}
      - VECTRA_NDR_TOKEN=${VECTRA_NDR_TOKEN:-}
      - VECTRA_COMMONNESS_SOURCE_ID=${VECTRA_COMMONNESS_SOURCE_ID:-tenant-01}
      - VECTRA_COMMONNESS_WRITE=${VECTRA_COMMONNESS_WRITE:-false}
      - VECTRA_COMMONNESS_LOOKBACK_DAYS=${VECTRA_COMMONNESS_LOOKBACK_DAYS:-30}
      - VECTRA_COMMONNESS_BATCH_SIZE=${VECTRA_COMMONNESS_BATCH_SIZE:-50}
      - VECTRA_COMMONNESS_PAGE_SIZE=${VECTRA_COMMONNESS_PAGE_SIZE:-100}
      - VECTRA_COMMONNESS_DISCOVERY_LIMIT=${VECTRA_COMMONNESS_DISCOVERY_LIMIT:-500}
      - VECTRA_COMMONNESS_CREATION_LIMIT=${VECTRA_COMMONNESS_CREATION_LIMIT:-100}
      - VECTRA_COMMONNESS_INTERVAL_SEC=${VECTRA_COMMONNESS_INTERVAL_SEC:-86400}
      - VECTRA_COMMONNESS_QUERY_TIMEOUT_SEC=${VECTRA_COMMONNESS_QUERY_TIMEOUT_SEC:-180}
      - VECTRA_COMMONNESS_REVIEW_WRITE=${VECTRA_COMMONNESS_REVIEW_WRITE:-false}
      - VECTRA_COMMONNESS_REVIEW_PAGE_SIZE=${VECTRA_COMMONNESS_REVIEW_PAGE_SIZE:-100}
      - VECTRA_COMMONNESS_REVIEW_MAX_PAGES=${VECTRA_COMMONNESS_REVIEW_MAX_PAGES:-10}
      - VECTRA_COMMONNESS_REVIEW_MAX_AGE_DAYS=${VECTRA_COMMONNESS_REVIEW_MAX_AGE_DAYS:-2}
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  ###########################
  # REPUTATION FEEDS        #
  ###########################

  connector-abuseipdb:
    image: opencti/connector-abuseipdb:7.260910.0
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ABUSEIPDB_ID}
      - CONNECTOR_NAME=AbuseIPDB
      - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr
      # Fail closed on fresh installs until that filter is configured in OpenCTI.
      - CONNECTOR_AUTO=false
      - CONNECTOR_AUTO_UPDATE=false
      - CONNECTOR_CONFIDENCE_LEVEL=80
      - ABUSEIPDB_MAX_AGE_DAYS=${ABUSEIPDB_MAX_AGE_DAYS:-30}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - CONNECTOR_LOG_LEVEL=info
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-ipqs:
    image: opencti/connector-ipqs:7.260910.0
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IPQS_ID}
      - CONNECTOR_NAME=IPQualityScore
      # IPQS connector does not support IPv6-Addr; adding it causes runtime ValueError.
      - CONNECTOR_SCOPE=IPv4-Addr,Domain-Name,Url
      # Paid enrichment is user-requested through OpenCTI UI/GraphQL only.
      - CONNECTOR_AUTO=false
      - CONNECTOR_AUTO_UPDATE=false
      - CONNECTOR_CONFIDENCE_LEVEL=80
      - CONNECTOR_EXPOSE_METRICS=true
      - CONNECTOR_METRICS_NAMESPACE=opencti
      - CONNECTOR_METRICS_SUBSYSTEM=ipqs
      - IPQS_PRIVATE_KEY=${IPQS_API_KEY}
      - IPQS_MAX_TLP=TLP:AMBER
      - IPQS_IP_ADD_RELATIONSHIPS=false
      - IPQS_DOMAIN_ADD_RELATIONSHIPS=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-flare:
    image: opencti/connector-flare:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_FLARE_ID}
      - CONNECTOR_NAME=Flare
      - CONNECTOR_SCOPE=flare
      - CONNECTOR_AUTO=true
      - CONNECTOR_CONFIDENCE_LEVEL=70
      - FLARE_API_KEY=${FLARE_API_KEY}
      - FLARE_INTERVAL_SEC=${FLARE_INTERVAL_SEC:-3600}
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-virustotal:
    image: opencti/connector-virustotal:7.260910.0
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_VIRUSTOTAL_ID}
      - CONNECTOR_NAME=VirusTotal
      # URL lookups provide an on-demand alternative when IPQS is unavailable.
      # Uploads remain disabled, so unseen URLs are never submitted to VT.
      - CONNECTOR_SCOPE=StixFile,Artifact,IPv4-Addr,IPv6-Addr,Domain-Name,Url
      # Paid enrichment is user-requested through OpenCTI UI/GraphQL only.
      - CONNECTOR_AUTO=false
      - CONNECTOR_AUTO_UPDATE=false
      - CONNECTOR_CONFIDENCE_LEVEL=75
      - CONNECTOR_EXPOSE_METRICS=true
      - CONNECTOR_METRICS_NAMESPACE=opencti
      - CONNECTOR_METRICS_SUBSYSTEM=virustotal
      - VIRUSTOTAL_TOKEN=${VT_API_KEY}
      - VIRUSTOTAL_MAX_TLP=TLP:AMBER
      - VIRUSTOTAL_REPLACE_WITH_LOWER_SCORE=true
      - VIRUSTOTAL_FILE_UPLOAD_UNSEEN_ARTIFACTS=false
      - VIRUSTOTAL_URL_UPLOAD_UNSEEN=false
      - VIRUSTOTAL_FILE_IMPORT_YARA=false
      - VIRUSTOTAL_IP_ADD_RELATIONSHIPS=true
      - VIRUSTOTAL_DOMAIN_ADD_RELATIONSHIPS=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-urlhaus:
    image: opencti/connector-urlhaus:7.260910.0
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_URLHAUS_ID:-cb83dadc-8b09-4943-a095-21b18dcb132c}
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=URLhaus
      - CONNECTOR_SCOPE=urlhaus
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT3H
      - URLHAUS_CSV_URL=https://urlhaus.abuse.ch/downloads/csv_recent/
      - URLHAUS_DEFAULT_X_OPENCTI_SCORE=80
      - URLHAUS_IMPORT_OFFLINE=true
      - URLHAUS_THREATS_FROM_LABELS=false
    mem_limit: 512m
    cpus: 1.0
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  connector-alienvault:
    image: opencti/connector-alienvault:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ALIENVAULT_ID}
      - CONNECTOR_NAME=AlienVault
      - CONNECTOR_SCOPE=alienvault
      - CONNECTOR_AUTO=true
      - CONNECTOR_CONFIDENCE_LEVEL=80
      - ALIENVAULT_BASE_URL=https://otx.alienvault.com
      - ALIENVAULT_API_KEY=${ALIENVAULT_API_KEY}
      - ALIENVAULT_TLP=White
      - ALIENVAULT_CREATE_OBSERVABLES=true
      - ALIENVAULT_CREATE_INDICATORS=true
      - ALIENVAULT_PULSE_START_TIMESTAMP=${ALIENVAULT_PULSE_START_TIMESTAMP:-2020-01-01T00:00:00}
      - ALIENVAULT_REPORT_TYPE=threat-report
      - ALIENVAULT_REPORT_STATUS=New
      - ALIENVAULT_GUESS_MALWARE=false
      - ALIENVAULT_GUESS_CVE=false
      - ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES=FileHash-MD5,FileHash-SHA1
      # Keep OTX pulse grouping semantic (reports + indicates/uses/targets); do not full-mesh pulse IOCs.
      - ALIENVAULT_ENABLE_RELATIONSHIPS=true
      - ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES=false
      - ALIENVAULT_INTERVAL_SEC=${ALIENVAULT_INTERVAL_SEC:-1800}
      - CONNECTOR_DURATION_PERIOD=PT30M
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  ###########################
  # OPENCTI DEFAULT DATA    #
  ###########################

  connector-opencti:
    image: opencti/connector-opencti:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID}
      - "CONNECTOR_NAME=OpenCTI Datasets"
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=100
    restart: always
    depends_on:
      opencti:
        condition: service_healthy      
  connector-mitre:
    image: opencti/connector-mitre:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID}
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=75      
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

volumes:
  esdata:
  s3data:
  redisdata:
  amqpdata:
